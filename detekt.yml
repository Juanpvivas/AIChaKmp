build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 60
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
  ComplexMethod:
    threshold: 15
  TooManyFunctions:
    thresholdInFiles: 25
    thresholdInClasses: 25

naming:
  FunctionNaming:
    # Composable functions use PascalCase
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
  TopLevelPropertyNaming:
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'

style:
  MaxLineLength:
    maxLineLength: 120
  WildcardImport:
    active: false
  ForbiddenComment:
    active: false
  ReturnCount:
    max: 3
  MagicNumber:
    active: false
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
