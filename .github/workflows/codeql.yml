name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # schedule:
  #   # Lunes 06:00 UTC, además de los eventos de push/PR de arriba.
  #   - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (Kotlin/Java)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Generate local.properties with API key
        run: echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > local.properties

      - name: Build Android (para que CodeQL pueda analizar)
        run: ./gradlew :composeApp:assembleDebug

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
