name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ktlint + detekt)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # continue-on-error: dejamos que reviewdog comente los hallazgos antes de
      # fallar el job (ver el step "Fail job if lint found issues" al final).
      - name: Run ktlint
        id: ktlint
        continue-on-error: true
        run: ./gradlew ktlintCheck

      - name: Run detekt
        id: detekt
        continue-on-error: true
        run: ./gradlew detekt

      - uses: reviewdog/action-setup@v1
        if: always()

      - name: Post ktlint findings on the PR
        if: always() && github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          for report in composeApp/build/reports/ktlint/**/*.xml; do
            reviewdog -f=checkstyle -name="ktlint" -reporter=github-pr-review < "$report"
          done

      - name: Post detekt findings on the PR
        if: always() && github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          for report in composeApp/build/reports/detekt/*.xml; do
            reviewdog -f=checkstyle -name="detekt" -reporter=github-pr-review < "$report"
          done

      - name: Fail job if lint found issues
        if: steps.ktlint.outcome == 'failure' || steps.detekt.outcome == 'failure'
        run: exit 1

  android:
    name: Android Build & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate local.properties with API key
        run: echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > local.properties

      - name: Build Android debug APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Run all tests
        run: ./gradlew :composeApp:allTests

  ios:
    name: iOS Build
    runs-on: macos-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Config.xcconfig with API key
        run: echo "GROQ_API_KEY = ${{ secrets.GROQ_API_KEY }}" > iosApp/Config.xcconfig

      - name: Build composeApp framework for simulator
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

      - name: Build iOS app with xcodebuild
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -configuration Debug \
            build

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate local.properties with API key
        run: echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > local.properties

      - name: Generate coverage report
        run: ./gradlew :composeApp:koverXmlReport

      - name: Post coverage report on the PR
        uses: mi-kas/kover-report@v1
        with:
          path: ${{ github.workspace }}/composeApp/build/reports/kover/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Reporte de cobertura
          update-comment: true
